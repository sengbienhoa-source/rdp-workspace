# Set the timeout for the submenu
set timeout=15


# Set the default variable to the submenu entry you prefer
set default=0


menuentry   'Boot Asus OS 32BIT : Feel the Speed'  --class custom   --class icon-chain  {
echo "booting to Asus OS 32BIT..."
echo "GrubCode By Markhor gaming phoenix os"
sleep 2
insmod all_video
search --set=root --file /asus/asus.findme
linux /asus/kernel quiet root=/dev/ram0 androidboot.selinux=permissive acpi_sleep=s3_bios,s3_mode SRC=/asus/
initrd /asus/initrd.img
}
